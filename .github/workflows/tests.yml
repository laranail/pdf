name: Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} · L${{ matrix.laravel }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['13']
        stability: [prefer-stable]
        include:
          # One lowest-dependency run on the floor. This is what catches a
          # constraint claiming a floor the code does not actually hold to.
          - php: '8.4'
            laravel: '13'
            stability: prefer-lowest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:^${{ matrix.laravel }}.0" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run the suite
        run: vendor/bin/pest --ci

  # Gotenberg is an HTTP service, so the driver's real behaviour cannot be
  # asserted against a mock alone. This runs the actual container.
  gotenberg:
    name: Gotenberg integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      gotenberg:
        image: gotenberg/gotenberg:8
        ports:
          - 3000:3000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Wait for Gotenberg
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 2
          done
          echo "Gotenberg never became healthy." >&2
          exit 1

      - name: Run the Gotenberg suite
        env:
          LARANAIL_PDF_GOTENBERG_URL: http://localhost:3000
        run: vendor/bin/pest --ci --group=gotenberg

  # The rendering engines are optional dependencies. This job proves it: with
  # both removed, everything except the render paths must still pass, and both
  # drivers must report themselves unavailable rather than fatal on a missing
  # class. An optional dependency nobody tests the absence of is a required one.
  without-optional-deps:
    name: Optional dependencies removed
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install without the rendering engines
        run: |
          composer remove --dev --no-update gotenberg/gotenberg-php dompdf/dompdf
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run the suite
        run: vendor/bin/pest --ci

      - name: Both drivers report unavailable rather than fatal
        run: vendor/bin/pest --ci --filter=AbsentDependenciesTest

  boot-health:
    name: Boot health
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Every binding resolves after a normal boot
        run: vendor/bin/pest --ci --filter=CommandsTest
